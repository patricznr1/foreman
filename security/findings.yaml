  - id: F-016
    title: "Event-chain reconstruction did not apply the resource scope"
    where:
      - "src/foreman/reasoners/event_chain/router.py"
      - "tests/integration/test_ressourcen_scope.py"
    observation: >
      POST /api/v1/reasoners/event_chain/reconstruct checked the role but not the
      resource scope. It takes an anchor alarm id in the request body; the service
      loads that alarm, derives its machine, and gathers alarms, worker notes and
      maintenance events of that machine into the returned and persisted
      explanation. A shift_lead is restricted to the machines of their lines, so
      passing an alarm id from another line would have returned data outside their
      scope. The neighbouring failure reasoner performs exactly this check.
    observation_is_correct: true
    severity_as_scanned: "high — cross-line data access for a restricted role"
    severity_after_triage: >
      high for profile B, where roles are genuinely restricted; not exploitable in
      the public demo, whose single account is a manager and therefore unrestricted
      by the role matrix in the first place
    status: fixed
    fixed_at: "2026-08-26"
    profile: [B]
    justification: >
      None. The check belongs there and was missing.
    remedy: >
      The route now takes ResourceScopeDep and resolves the anchor through a helper
      that returns 404 both when the alarm does not exist and when it lies outside
      the caller's scope — the same shape as the single-alarm read in
      api/routers/alarms.py, and for the same reason: a 403 would confirm that the
      alarm exists. The check runs before the reasoner starts, not on its result,
      because by then the data would already have been gathered.

      Two behaviour tests were added as a pair: a foreign anchor is refused with 404
      and leaves no persisted explanation; an own anchor is not refused. The pair
      matters — without the second test the first would stay green even if every
      reconstruction failed for an unrelated reason. Counter-check run: with the fix
      removed the refusal test fails and the twin still passes.
    evidence:
      - "src/foreman/reasoners/event_chain/router.py"
      - "tests/integration/test_ressourcen_scope.py"
    review_by: "2027-02-26"

  - id: F-017
    title: "Drift acknowledgement did not apply the resource scope"
    where:
      - "src/foreman/reasoners/drift/router.py"
      - "tests/integration/test_ressourcen_scope.py"
    observation: >
      POST /api/v1/reasoners/drift/alarms/{alarm_id}/acknowledge checked the role
      but not the resource scope, while the GET listing in the same file applies it.
      A shift_lead could therefore mark a drift warning on another line as handled.
    observation_is_correct: true
    severity_as_scanned: "medium to high — integrity, not confidentiality"
    severity_after_triage: >
      the damage here is the write, not the read: an acknowledgement means "a human
      has dealt with this", and it removes the warning from the open items of the
      people actually responsible for that line. Rated below F-016 because no data
      leaves, and irrelevant for manager and technician, who are unrestricted
    status: fixed
    fixed_at: "2026-08-26"
    profile: [B]
    justification: >
      None. The listing next to it had the check; the write did not.
    remedy: >
      The handler now takes ResourceScopeDep, and the existing not-found branch also
      covers a machine outside the caller's scope — one condition, one answer, no
      second code path to drift away from the first. Behaviour tests as a pair: a
      foreign warning is refused with 404 and stays unacknowledged in the database;
      an own warning is acknowledged and the timestamp is set. Counter-check run
      with the fix removed.
    evidence:
      - "src/foreman/reasoners/drift/router.py"
      - "tests/integration/test_ressourcen_scope.py"
    review_by: "2027-02-26"

  - id: F-018
    title: "CI gates are not enforced by repository governance"
    where:
      - ".github/workflows/ci.yml"
    observation: >
      The default branch is not protected, no required status checks are configured
      and no repository rulesets exist. The pipeline has gates; GitHub does not
      require them to have passed before main changes.
    observation_is_correct: true
    severity_as_scanned: "medium — governance"
    severity_after_triage: >
      no technical vulnerability: every change to date went through a pull request
      with green CI, and there is a single maintainer with no other write access.
      What is missing is the enforcement, and that distinction is exactly what a
      reviewer should hold against this repository
    status: planned
    profile: [A, B]
    remedy: >
      Protect the default branch: require the CI checks to pass, require a pull
      request before merging, disallow force pushes and branch deletion. This is a
      deliberate change to how the maintainer works — it makes a direct push to main
      impossible, including in a hurry — and is therefore recorded here for decision
      rather than applied silently.
    review_by: "2026-11-26"

  - id: F-019
    title: "The JWT algorithm is a runtime setting rather than a fixed decision"
    where:
      - "src/foreman/config.py"
      - "src/foreman/core/security.py"
    observation: >
      jwt_algorithm defaults to HS256 but can be set through the environment, and
      both encode and decode read the same setting.
    observation_is_correct: true
    severity_as_scanned: "low — hardening"
    severity_after_triage: >
      not the classic algorithm-confusion flaw, because signing and verification use
      the same configured value; there is no path by which an attacker chooses the
      algorithm. What remains is that a security decision sits where an operational
      one belongs, and a misconfiguration would be accepted rather than rejected
    status: planned
    profile: [A, B]
    remedy: >
      Fix the algorithm in code, or accept only an explicit allow-list of supported
      values, so that an unsupported setting fails at startup instead of at the
      first token.
    review_by: "2026-11-26"

  - id: F-020
    title: "The frontend BFF has no explicit origin check on mutating requests"
    where:
      - "frontend/next.config.ts"
    observation: >
      The BFF holds the JWT in an httpOnly, SameSite=Lax cookie and attaches it as a
      bearer token towards the backend. Mutating requests are not additionally
      checked against Origin or Sec-Fetch-Site, and no CSRF token is used.
    observation_is_correct: true
    severity_as_scanned: "low — defence in depth"
    severity_after_triage: >
      SameSite=Lax already blocks the classic cross-site POST, and no exploit path
      has been demonstrated. The reason to add a check anyway is deployment: on
      shared or sibling-subdomain infrastructure the cookie attribute alone is a
      thinner boundary than it looks
    status: planned
    profile: [A, B]
    remedy: >
      Check Origin (or Sec-Fetch-Site) on every mutating BFF route and reject what
      does not match the deployment's own origin, keeping SameSite and httpOnly as
      they are.
    review_by: "2026-11-26"

  # ---------------------------------------------------------------------------
  # F-021 and F-022 share one root: the memory recall was filtered in exactly one
  # of the three places that use it. Found on 2026-08-26 by a review that asked
  # the follow-up question to F-016/F-017 — "where else?" — across every path to
  # machine data. Four of six paths came back clean.
  # ---------------------------------------------------------------------------

  - id: F-021
    title: "Recalled memories from other lines reached the event-chain explanation"
    where:
      - "src/foreman/reasoners/event_chain/service.py"
      - "src/foreman/reasoners/event_chain/schema.py"
      - "src/foreman/reasoners/event_chain/router.py"
      - "src/foreman/reasoners/event_chain/recall.py"
    observation: >
      The event-chain reasoner queries the memory substrate for similar incidents.
      That query is deliberately not machine-specific — it matches on machine class,
      alarm signature and category, and therefore finds comparable machines on other
      lines. The hits were used unfiltered: they became sibling references carrying
      the foreign machine id and an excerpt of the mirrored free text, they were
      persisted in the frozen snapshot, and they went into the language model as
      grounding sources. The archive search calls the same recall function and does
      filter it.
    observation_is_correct: true
    severity_as_scanned: "high — cross-line data reachable through an allowed resource"
    severity_after_triage: >
      higher than F-016/F-017 for three reasons: it reaches a reader through a
      resource they are entitled to, the excerpt names the foreign machine in plain
      text and carries mirrored free text, and the frozen snapshot keeps working
      after the fact. Not exploitable in the public demo, whose only account is a
      manager and therefore unrestricted
    status: fixed
    fixed_at: "2026-08-26"
    profile: [B]
    justification: >
      None. Worse than absent: the docstring of the siblings route stated that the
      references carry no machine id of their own and inherit the scope of their
      explanation. Both halves were untrue, and that sentence is why the gap stayed
      invisible — it answered the question before anyone asked it.
    remedy: >
      Filtered twice, because the two filters protect different things.

      At creation, immediately after the recall and before anything else uses it:
      the hits go two ways from there — into the sibling references and into the
      language model. A filter further down would have been too late for the second,
      because the narrative would already have been written and might have
      paraphrased what it saw.

      At delivery, against the scope of the READER: the snapshot is frozen and is
      read later by other people. An explanation a manager created legitimately
      contains the whole fleet; a worker retrieving the same explanation must still
      not see it. The scope decides what a reader gets, not what is stored.

      Both filters live in one function each, shared with the archive search, which
      previously carried its own inline copy. Separate filters are the place where
      one path falls behind — which is exactly what happened here.

      The strictness matches the archive search: a hit without a resolved machine
      drops out for a restricted role, because its membership is unproven.

      Four tests, two pairs. Counter-checks run separately per filter: disabling the
      creation filter fails only its own test, disabling the delivery filter fails
      only its own — so neither test is standing in for the other. The twins prove
      the filters do not simply remove everything: an own memory survives, and an
      unrestricted manager still sees the complete snapshot.
    evidence:
      - "src/foreman/reasoners/event_chain/recall.py"
      - "src/foreman/reasoners/event_chain/schema.py"
      - "tests/integration/test_ressourcen_scope.py"
      - "tests/reasoners/event_chain/test_service.py"
    review_by: "2027-02-26"

  - id: F-022
    title: "The same unfiltered recall fed the worker recommendation prompt"
    where:
      - "src/foreman/reasoners/failure/recommendation.py"
    observation: >
      The failure reasoner's recommendation runs the same kind of recall — machine
      class rather than machine — and passed the hits into the language model as
      grounding sources without applying the resource scope.
    observation_is_correct: true
    severity_as_scanned: "low"
    severity_after_triage: >
      lower than F-021 and stated as such: the raw texts do not appear in the
      response, which carries only the generated recommendation and its source ids,
      and a foreign machine number would in most cases fail the numeric grounding
      guard because no trusted source supports it. What can pass through is the
      substance of another machine's incident, paraphrased and unattributed. That is
      a possible path, not a demonstrated leak, and it is recorded as the former
    status: fixed
    fixed_at: "2026-08-26"
    profile: [B]
    justification: >
      None. Same root as F-021, same fix, and it would have been the next place to
      go wrong on its own.
    remedy: >
      The recommendation service takes the caller's scope and filters the recall
      immediately, using the shared function. Both services take that scope as a
      constructor argument WITHOUT a default value: a default of "unrestricted"
      would mean that whoever forgets it gets the whole fleet, and that is the
      decision this register exists to make visible.
    evidence:
      - "src/foreman/reasoners/failure/recommendation.py"
      - "src/foreman/reasoners/event_chain/recall.py"
    review_by: "2027-02-26"

  - id: F-023
    title: "The MCP interface has no role model and no resource scope"
    where:
      - "src/foreman/mcp/auth.py"
      - "src/foreman/mcp/server.py"
      - "SECURITY.md"
    observation: >
      The MCP server authenticates a single shared bearer token. It decodes no JWT,
      loads no user record and reads no role, so neither the role matrix nor the
      ResourceScope class applies on that path. Whoever holds the token reads the
      whole fleet.
    observation_is_correct: true
    severity_as_scanned: "high — reads as unrestricted access to all machine data"
    severity_after_triage: >
      not a scope defect, and the distinction matters: a scope violation requires a
      user whose scope is exceeded, and on this path there is no user. It is a
      system-to-system entrance, the same category as a database connection. Raised
      during the review of all access paths on 2026-08-26 and recorded rather than
      dismissed, because SECURITY.md section 5 lists privilege escalation past role
      and resource scoping as in-scope — a reader was entitled to expect this
      interface to be covered by it, and nothing said otherwise
    status: accepted
    profile: [B]
    depends_on: >
      That the MCP token is handled as a system secret — issued only to trusted
      integrating systems, held in a secret store, never given to a person as a
      substitute for a login. If it ever becomes something a user holds, this
      acceptance fails, and the interface needs an identity and a scope before that
      happens. The token is rejected at startup in production when it is missing or
      shorter than 32 bytes (mcp/auth.py, require_secure_token).
    justification: >
      Three properties bound the consequence. The interface is read-only by
      construction — there is no tool that writes, and a test asserts it. Personal
      data is pseudonymized or masked on this path as on every other. And the
      interface runs as its own application on its own port, so the token opens
      nothing beyond it. What remains is unrestricted READING of machine data by a
      trusted system, which is what an integration is for.
    remedy: >
      Documented rather than changed: SECURITY.md section 4 now states plainly that
      the role model does not apply on this path and why. Should per-client
      attribution arrive (GROUND_TRUTH.md marks per-client MCP attribution as vision), a scope becomes
      possible and this entry is to be re-decided rather than extended.
    review_by: "2027-02-26"
