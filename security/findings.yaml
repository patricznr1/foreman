  - id: F-013
    title: "A cyclomatic-complexity gate is claimed but was not configured"
    where:
      - "pyproject.toml"
      - "README.md"
      - "AGENTS.md"
      - "SECURITY-INSIGHTS.yml"
    observation: >
      Three documents name a cyclomatic-complexity gate among the quality gates.
      The ruff configuration selected no C90 rules and set no mccabe threshold,
      so nothing measured complexity in CI or locally.
    observation_is_correct: true
    severity_as_scanned: "n/a — documentation drift"
    severity_after_triage: >
      low in effect, high in credibility: a reader relying on the claim would
      believe a control existed that did not run
    status: fixed
    fixed_at: "2026-08-26"
    profile: [A, B]
    justification: >
      None was offered — the claim was not true when it was written.
    remedy: >
      Closed by building the gate rather than removing the claim. `C90` is now
      selected and `[tool.ruff.lint.mccabe] max-complexity = 12` is set. The
      threshold was chosen against a measurement over the scope CI actually runs
      (`ruff check` with no path argument, which is wider than src and tests): at
      10 the application code has exactly three violations, all at complexity 11 —
      `_referential_integrity`, `reconstruct_chain` and `nachtragen`. Setting 10
      would have meant rewriting three working functions to make a linter pass,
      which is a separate decision with its own risk. Twelve sits one step above
      the highest existing value, so the gate blocks growth without demanding a
      refactor as its entry price, and the reasoning sits in pyproject.toml where
      the next person raising it will read it.

      One exception is recorded rather than hidden: `scripts/**` is exempt from
      C901. The check scripts are flat chains of independent conditions of the form
      "if this, report that" — `pruefe_soa` is thirteen of them with no nesting.
      The metric counts rules there, not difficulty; splitting them would scatter
      the rules across functions and make them harder to read, not easier. Without
      the exemption the gate reports six violations, all six in
      scripts/check_compliance.py and none in application code. Every other rule
      still applies to those files.

      Verified by a control point in application code, not by assumption: a
      deliberately branch-heavy function added to src/foreman/db/scope_sql.py was
      rejected at complexity 14, and the check passed again once it was removed.
    evidence:
      - "pyproject.toml"
    review_by: "2027-02-26"

