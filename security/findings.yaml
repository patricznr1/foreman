  # ---------------------------------------------------------------------------
  - id: F-008
    title: "README and specification claim CI gates that CI does not run"
    where:
      - "README.md"
      - "GROUND_TRUTH.md"
      - ".github/workflows/ci.yml"
    observation: >
      Both documents list a secrets scan and a dependency audit among the quality
      gates. The CI workflow runs type checking, linting and tests only; there is
      no pip-audit, npm audit, gitleaks or bandit step, and none of these are
      declared as development dependencies. There is also no Dependabot
      configuration.
    observation_is_correct: true
    severity_as_scanned: "n/a — documentation drift"
    severity_after_triage: >
      high for credibility, and the easiest of all entries to close by building
      the thing rather than editing the claim
    status: fixed
    fixed_at: "2026-08-26"
    profile: [A, B]
    justification: >
      None was offered — the claim was not true when it was written.
    remedy: >
      Closed by building the gate rather than editing the claim. CI now runs
      gitleaks as its own job over the full history (a secret committed and later
      removed stays retrievable in the history, so scanning only the tip would
      miss it), pip-audit against the resolved dependency tree, and npm audit at
      the high threshold. Dependabot security updates cover uv, npm, workflow
      actions and Docker images as a second source; its routine version bumps are
      switched off on purpose, because an audit answers whether something is
      vulnerable while a version subscription only answers whether something newer
      exists. Exclusions in .gitleaks.toml match PATTERNS —
      hex counting sequences and German placeholder wording — not paths, so a real
      secret in a test file still trips the gate. Measured on a fresh clone: three
      placeholders found without the allowlist, none with it, and three
      realistic-looking keys still detected.
    evidence:
      - ".github/workflows/ci.yml"
      - ".gitleaks.toml"
      - ".github/dependabot.yml"
    review_by: "2027-02-26"

