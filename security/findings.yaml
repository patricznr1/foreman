  - id: F-009
    title: "Container base images are not pinned by digest"
    where:
      - "Dockerfile:8"
      - "Dockerfile:11"
      - "frontend/Dockerfile:11"
    observation: >
      Base images are referenced by mutable tag, one of them by :latest, while
      the CI workflow pins its actions to commit hashes. Builds are therefore not
      reproducible and a compromised upstream tag would be pulled silently.
    observation_is_correct: true
    severity_as_scanned: "medium"
    severity_after_triage: "medium — supply-chain hygiene, not an active exposure"
    status: planned
    profile: [A, B]
    justification: >
      The inconsistency is the strongest part of this finding: the same repository
      pins GitHub Actions to commit hashes, so the standard is understood and
      simply was not applied to the image layer.
    remedy: "Pin base images by digest and keep them updated deliberately."
    review_by: "2026-11-30"

