  # ---------------------------------------------------------------------------
  - id: F-005
    title: "Insecure default JWT secret with a fail-open environment default"
    where:
      - "src/foreman/config.py:18"
      - "src/foreman/config.py:38"
      - "src/foreman/config.py:128"
    observation: >
      A placeholder JWT secret is present in the source. A startup guard refuses
      the default and any secret shorter than 32 bytes — but only when the
      environment is classified as production, and the environment setting
      defaults to "development".
    observation_is_correct: true
    severity_as_scanned: "critical"
    severity_after_triage: >
      medium — the guard exists and works; its trigger condition defaults the
      wrong way
    status: planned
    profile: [A, B]
    justification: >
      The hardcoded string itself is a placeholder, not a secret, and the guard
      that rejects it runs before anything else in application startup. What is
      genuinely wrong is the direction of the default: an unset ENVIRONMENT
      variable yields "development", which disables the guard and additionally
      exposes the API documentation routes. A security guard whose default is
      "off" is a guard with a gap.
    remedy: >
      Invert the default so that an unset environment is treated as production,
      or require the environment to be set explicitly and refuse to start
      otherwise. The deployment documentation already sets it; the code should
      not depend on that.
    review_by: "2026-11-30"

  # ---------------------------------------------------------------------------
  - id: F-006
    title: "No rate limiting on authentication or across the API"
    where:
      - "src/foreman/api/auth.py:25"
    observation: >
      The login route has no brute-force protection, and there is no API-wide
      rate-limiting middleware. Rate limiting exists only for language-model
      consumption and on the MCP interface.
    observation_is_correct: true
    severity_as_scanned: "medium"
    severity_after_triage: "medium in profile B, low in profile A"
    status: planned
    profile: [A, B]
    justification: >
      Partially mitigated by design: the login returns a uniform 401 that does not
      distinguish unknown user from wrong password, passwords are bcrypt-verified,
      and the demo instance has exactly one account whose password is public — so
      brute force against profile A has nothing to gain. In profile B, with
      per-user accounts, this is a genuine gap.
    remedy: >
      Add per-IP and per-account throttling on the login route, and a general
      request limiter, before any deployment with real accounts.
    review_by: "2026-11-30"

