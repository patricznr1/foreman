  # ---------------------------------------------------------------------------
  - id: F-011
    title: "SQL built with f-strings in the search paths"
    where:
      - "src/foreman/notes/search.py:142"
      - "src/foreman/notes/search.py:173"
      - "src/foreman/archive/search.py:88"
    observation: >
      Raw SQL is assembled with f-string interpolation, a pattern that
      pattern-matching scanners report as SQL injection.
    observation_is_correct: false
    severity_as_scanned: "critical"
    severity_after_triage: "none — false positive"
    status: disputed
    profile: [A, B]
    justification: >
      Two values are interpolated, and neither can be reached from user input.
      The first is a fixed scope fragment produced by db/scope_sql.py, which
      itself uses bound parameters. The second is the table name, which cannot be
      a bound parameter in SQL — an identifier never can. It is constrained by an
      allowlist (_FULLTEXT_TABLES) with a hard raise in front of the query, called
      from two fixed call sites, and a test drives "users; DROP TABLE" into it and
      requires the abort. Every user-supplied value — query text, query vector,
      result count — is passed as a bound parameter.

      This entry was rewritten on 2026-08-26. The earlier wording claimed a single
      interpolated value and did not mention the table name at all. The protection
      around it is in fact the stronger of the two, but a justification that omits
      half of what it justifies is a defect in the register — which is precisely
      what this register is meant to make findable.
    evidence:
      - "src/foreman/db/scope_sql.py:51"
      - "src/foreman/archive/search.py:85"
      - "tests/archive/test_archive_search.py"
    open_work: >
      A short comment at each interpolation site stating why it is safe would
      let a reviewer confirm this in seconds instead of tracing the call graph.
    review_by: "2027-02-26"

