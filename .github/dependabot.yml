# =============================================================================
# dependabot.yml — Abhängigkeits-Überwachung, auf Sicherheit beschränkt
# -----------------------------------------------------------------------------
# `open-pull-requests-limit: 0` schaltet die ROUTINE-Vorschläge ab: kein Pull
# Request mehr, nur weil eine neuere Version existiert. SICHERHEITS-Updates
# laufen weiter — die entstehen aus den Dependabot-Warnungen und nicht aus dieser
# Datei, und genau die waren gemeint.
#
# WARUM ABGESCHALTET, nachdem es einen Tag lief: Beim Einschalten öffneten sich
# binnen einer Minute vierzehn Pull Requests. Jeder davon benachrichtigt alle,
# die dem Repo folgen, und verbraucht einen vollständigen Prüflauf. Sechs
# schlugen Hauptversionssprünge vor, darunter einen auf `mcp` 2.0 — den
# pyproject.toml mit `<2` ausdrücklich ausschließt.
#
# Das ist der Unterschied, um den es geht: Ein Abhängigkeits-Audit beantwortet
# „ist etwas davon verwundbar". Ein Versions-Abo beantwortet „gibt es etwas
# Neueres". Nur die erste Frage gehört zur Sicherheitslage; die zweite ist
# Pflegearbeit und wird hier bewusst von Hand entschieden.
#
# Die Ökosysteme bleiben eingetragen, damit die Sicherheits-Updates jedes davon
# erreichen und die Einstellung sichtbar bleibt statt gelöscht zu sein.
# =============================================================================
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
