# ============================================================
#  FOREMAN — CI (Quality Gates, GROUND_TRUTH §10.2)
#  Läuft bei jedem Push auf main und bei jedem Pull Request:
#  mypy --strict · ruff (lint + format) · pytest gegen eine ECHTE
#  TimescaleDB/pgvector (Service-Container) — inklusive Integrationstests,
#  Red-Team-Injection und Coverage-Gate (≥ 85 %, in pyproject erzwungen).
#  Die @smoke-Tests (echtes Ollama) skippen sauber, die @ner-Tests
#  (560-MB-spaCy-Modell) sind opt-in und im Pflichtlauf deselektiert.
# ============================================================
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: mypy · ruff · pytest (real TimescaleDB)
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: foreman
          POSTGRES_PASSWORD: foreman
          POSTGRES_DB: foreman_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U foreman -d foreman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      # Integrationstests laufen gegen den Service-Container (conftest liest diese Var).
      FOREMAN_TEST_DATABASE_URL: postgresql+asyncpg://foreman:foreman@localhost:5433/foreman_test

    steps:
      - name: Checkout
        # Auf Commit-Hash gepinnt wie im Frontend-Job: Ein Tag ist verschiebbar, ein
        # Hash nicht — wer das Upstream-Repo übernimmt, führte sonst beim nächsten
        # Lauf eigenen Code in dieser Pipeline aus. `persist-credentials: false`
        # hält den GITHUB_TOKEN aus der Git-Konfiguration des Runners, wo jeder
        # Folgeschritt ihn läse; dieser Job braucht ihn nach dem Auschecken nicht.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        # Exakter Pin: setup-uv publiziert ab v8 keine Major-/Minor-Tags mehr
        # (Supply-Chain-Härtung) — der Commit-Hash macht ihn unverschiebbar.
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Type check — mypy --strict
        run: uv run mypy

      - name: Lint — ruff check
        run: uv run ruff check

      - name: Format — ruff format --check
        run: uv run ruff format --check

      - name: Tests + coverage — pytest (integration, red-team, ≥85 %)
        run: uv run pytest

      - name: Abhängigkeits-Audit — pip-audit
        # `--no-emit-project`: Der Export enthält sonst das Projekt selbst als
        # lokalen Pfad, und pip-audit versucht es zu installieren.
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --progress-spinner off

  secret-scan:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Volle Historie: Ein Geheimnis, das einmal committet und danach entfernt
        # wurde, steht weiterhin im Verlauf und ist weiterhin abrufbar. Ein Scan
        # nur über den letzten Stand fände es nicht.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Geheimnis-Scan — gitleaks
        # Per Digest festgenagelt statt per Marke: Dieselbe Begründung wie bei den
        # Pipeline-Schritten oben — eine Marke ist verschiebbar, ein Digest nicht.
        # Die Ausnahmen stehen in .gitleaks.toml und treffen Muster, nicht Pfade.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f             git --no-banner --redact -c .gitleaks.toml

  frontend-gates:
    name: frontend · tokens · tsc · eslint · vitest · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        # Auf Commit-Hash gepinnt (Supply-Chain-Härtung, zizmor); persist-credentials
        # aus, da nach dem Checkout keine Git-Operationen folgen.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Design-Tokens in sync (generierte CSS == Quelle)
        run: npm run tokens:check

      - name: Type check — tsc --noEmit (strict)
        run: npm run typecheck

      - name: Lint — eslint
        run: npm run lint

      - name: Tests — vitest
        run: npm test

      - name: Abhängigkeits-Audit — npm audit
        # Schwelle `high`: Niedrigere Meldungen betreffen hier durchweg
        # Entwicklungswerkzeuge und würden das Tor stumpf machen, weil man sich
        # an ein rotes Ergebnis gewöhnt. Der Stand ist heute ohne offene Punkte —
        # ein Treffer ist damit ein echtes Signal, kein Grundrauschen.
        run: npm audit --audit-level=high

      - name: Build — next build
        run: npm run build
