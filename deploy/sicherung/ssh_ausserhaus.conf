# ============================================================
#  FOREMAN — deploy/sicherung/ssh_ausserhaus.conf
#  Zweck: ssh-Konfiguration für die Sicherung außer Haus: restic -> Hetzner
#         Storage Box über SFTP (Port 23); nur ausserhaus.sh liest sie.
#  Architektur-Einordnung: Betrieb. Vorbild: deploy/sicherung/ im NEXUS-Repo.
# ============================================================
#
# ausserhaus.sh gibt sie restic mit `-o sftp.args="-F <diese Datei>"`. -F
# schaltet ~/.ssh/config und /etc/ssh/ssh_config ab: Der Lauf hängt an nichts,
# was nur auf dem Server von Hand eingetragen ist.
#
# Von Hand verbinden (als root, prüft Schlüssel und Host-Schlüssel; Konto und
# Name der Box stehen in /srv/foreman/env/restic.repo):
#   sftp -F /srv/foreman/app/deploy/sicherung/ssh_ausserhaus.conf <konto>@<konto>.your-storagebox.de

Host *.your-storagebox.de
    Port 23
    # Hetzner nennt dieselben Host-Schlüssel für alle Boxen; unter dem Alias
    # steht in storagebox_known_hosts kein Kontoname
    HostKeyAlias hetzner-storagebox
    # Derselbe Schlüssel wie für NEXUS: eine Box, ein Zugang des Servers. Die
    # Trennung liegt im eigenen Verzeichnis und im eigenen restic-Passwort.
    IdentityFile /root/.ssh/nexus_ausserhaus
    IdentitiesOnly yes
    # Nur die abgeglichenen Host-Schlüssel zählen, auch kein globaler Eintrag
    UserKnownHostsFile /srv/foreman/app/deploy/sicherung/storagebox_known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    UpdateHostKeys no
    BatchMode yes
    # Ohne Lebenszeichen schließt die Box die Verbindung, während restic
    # unveränderte Daten liest (restic-Doku, SFTP)
    ServerAliveInterval 60
    ServerAliveCountMax 240
