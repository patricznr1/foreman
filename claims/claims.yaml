  - id: "C-095"
    aussage: "Die Suche war seit dem Modellwechsel sechsunddreissigmal langsamer als noetig, weil die Rechenbibliothek die Kerne des Wirts statt der Zuteilung des Behaelters zaehlte."
    status: "gemessen"
    wert: "Median je Suchaufruf 5,505 s bei 48 Threads gegen 0,154 s bei 16 Threads; der Cloud-Weg lag bei 0,190 s"
    bedingung: >-
      Erhoben am 28.08.2026 im Betriebsbehaelter, 79 Aufrufe je Stufe, der
      erste Aufruf (Modell laden, 12,048 s) verworfen. Gemessen ist der
      vollstaendige Suchaufruf, nicht das Einbetten allein.
      URSACHE: torch bemisst seine Threadzahl an os.cpu_count(); das meldet im
      Behaelter die 48 Kerne des Wirts, waehrend /sys/fs/cgroup/cpu.max eine
      Quote von 24 ausweist. Bei einer einzelnen kurzen Anfrage ist die Rechnung
      winzig, und der Aufwand fuer die Abstimmung zwischen den Threads
      uebersteigt sie. Einbettungszeit gegen Threadzahl, Median: 48 -> 5,340 s,
      24 -> 0,193 s, 16 -> 0,082 s, 8 -> 0,087 s, 4 -> 0,113 s, 1 -> 0,322 s.
      DIE EINSTELLUNG AENDERT KEINE ERGEBNISSE: Vektoren weichen um 2e-07 je
      Komponente ab (Kosinus 1,000000000), und ein vollstaendiger Armlauf ueber
      acht Grenzwerte liefert bei 16 wie bei 48 Threads byteweise identische
      Trefferlisten.
    datum: "2026-08-28"
    fundstelle:
      - "src/foreman/embeddings/backends.py, _begrenze_threads"
      - "tests/embeddings/test_thread_begrenzung.py"
      - "docs/messungen/2026-08-28_modellwechsel_mbrc.md, Abschnitt 2"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      DER UEBERTRAGBARE BEFUND betrifft nicht die Bibliothek, sondern das
      Messen selbst — und er ist schaerfer, als er zuerst aussah.
      DIE ZAHL WAR DA. `foreman_embed_latency_seconds{backend=
      "sentence_transformers"}` wird seit F-SEM befuellt (provider.py ruft
      observe_embedding an vier Stellen). Die fuenfeinhalb Sekunden standen seit
      dem Modellwechsel in dieser Kennzahl. Es fehlte nicht die Erhebung,
      sondern der Anlass hinzusehen: kein Schwellwert, keine Meldung, kein
      Vergleichspunkt. Eine Suche, die fuenfeinhalb Sekunden braucht, wirft
      nicht — sie ist nur langsam, und langsam sieht aus wie "das dauert eben".
      Gefunden hat den Fehler der Widerspruch zu einem zweiten System, das
      dieselbe Aufgabe auf derselben Plattform im Millisekundenbereich loest.
      Eine Zahl, die zu einem anderen Messpunkt nicht passt, ist ein Anlass zum
      Nachsehen und kein Ergebnis.
      WAS TATSAECHLICH FEHLT, in dieser Reihenfolge: ein Schwellwert auf der
      vorhandenen Einbettungs-Kennzahl; eine Kennzahl fuer den VOLLEN
      Suchaufruf, die es bis heute nicht gibt; und ein regelmaessiger Blick auf
      beide. C-090 haelt separat fest, dass fuer die Plattform selbst keine
      Antwortzeit-Verteilung erhoben war — das bleibt richtig und betrifft den
      Suchaufruf, nicht das Einbetten.
      NACHTRAG ZUR BEHEBUNG SELBST, ebenfalls am 28.08.2026 gemessen:
      `torch.set_num_threads` wirkt THREAD-LOKAL. Der Encode-Pfad laeuft ueber
      einen Thread-Vorrat (asyncio.to_thread); die Begrenzung muss deshalb bei
      JEDEM Aufruf gesetzt werden, nicht nur beim Laden des Modells. Die erste
      Fassung der Behebung setzte sie nur im Ladezweig und wirkte damit
      ausschliesslich fuer den Thread, der zufaellig zuerst da war. Bei
      sequenziellen Aufrufen faellt das nicht auf, weil derselbe Thread
      wiederverwendet wird — erst mehrere Anfragen zugleich verteilen sich.
      Belegt: sechs gleichzeitige Anfragen, je 0,42 s, Wanduhr 0,45 s.
      Nebenbefund derselben Messung: Der Haupt-Thread meldet weiterhin 48,
      waehrend der Arbeits-Thread mit 16 rechnet. Wer die Wirksamkeit an
      `torch.get_num_threads()` im Haupt-Thread pruefen wollte, kaeme zum
      falschen Schluss.

