    bedingung: >-
      Gemessen am 24.08.2026 gegen die laufende Instanz über den Bewertungssatz
      aus C-047, k=10. Fünf Schwellenwerte gefahren (0,55 · 0,60 · 0,65 · 0,75 ·
      0,95). Der Ausgangswert 0,55 war im Code ausdrücklich als "konservativer
      Start" bezeichnet und stammte nicht aus einer Messung. Bei 0,55 fielen
      sämtliche bedeutungsbasierten Treffer heraus: sechs Anfragen mit reinen
      Sinnverwandten des gesuchten Sachverhalts lieferten nichts, während die
      wörtlichen Begriffe trafen — die Suche arbeitete faktisch als reine
      Volltextsuche, ohne dass ein Fehler auffiel. Gewählt wurde 0,60, weil ab
      0,65 der Anteil zutreffender Treffer unter ein Drittel fällt (0,300 bei
      0,65 gegenüber 0,415 bei 0,60).
    datum: "2026-08-24"
    fundstelle:
