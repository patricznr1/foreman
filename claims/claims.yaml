      Gedächtnis-Treffer auf lokalem Rang 1 erhält 1/61 und schlägt jeden eigenen
      Treffer ab lokalem Rang 2 (1/62). Die Fusion gewichtet ausschliesslich die
      Position innerhalb einer Liste — nicht die Güte der Liste und nicht die des
      Treffers. Verloren gehen fast ausschliesslich Schichtnotizen, also Treffer
      aus der einzigen Quelle mit Vektorzweig; gewonnen werden überwiegend
      Wartungen. Auf dem alten Bestand trat das nie auf, weil dort kaum etwas zu
      verdrängen war (C-050). Erschwerend: Die Ranglisten sind nicht
      kommensurabel — ts_rank, Cosinus-Distanz und die Relevanz der Gegenstelle
      haben keine gemeinsame Skala, und die Fusion verwirft sie. Es gibt derzeit
      kein Signal, an dem sich entscheiden liesse, ob ein Erinnerungs-Treffer
      besser ist als eine verdrängte Notiz.
