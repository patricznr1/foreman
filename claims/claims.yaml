  - id: "C-050"
    aussage: "Das Gedächtnis als vierte Archiv-Quelle erfüllt seine Freigabe-Bedingung im gegenwärtigen Zustand nicht."
    status: "gemessen"
    wert: "0 % der Anfragen mit zusätzlichem zutreffendem Treffer (gefordert: mindestens 30 %); auf 11 von 18 Anfragen verschlechterte Reihenfolge"
    bedingung: >-
      Gemessen am 24.08.2026 gegen die laufende Instanz über den Bewertungssatz
      aus C-047, bei justierter Schwelle 0,60, im unmittelbaren Vergleich mit
      und ohne die vierte Quelle. Trefferquote unverändert 0,256; Genauigkeit
      0,415 → 0,223; Ranggüte 0,372 → 0,266; mittlere Antwortzeit 0,43 s → 2,40 s.
      Ursache ist der Inhalt der Erinnerungen, nicht das Verfahren: Von sieben
      Formulierungsbausteinen führt nur der für Schichtnotizen echten Freitext,
      die übrigen geben allein die Struktur wieder. Eine Wartungserinnerung lautet
      "Wartung (lubrication) an Maschine 1 durchgeführt" — der Vorgangsgrund, der
      in der Beschreibung stünde, fehlt. Zusätzlich waren Schichtnotizen zum
      Messzeitpunkt überhaupt nicht gespiegelt.
    datum: "2026-08-24"
    fundstelle:
      - "src/foreman/substrate/content.py, CONTENT_BUILDERS"
      - "GROUND_TRUTH.md, Abschnitt 15.10"
    geltung: "ueberholt"
    geltung_grund: >-
      UEBERHOLT AM 29.08.2026, nicht wegen eines Rechenfehlers, sondern weil ein
      Pfad geaendert wurde, der dieser Messung zugrunde lag. Die Gegenstelle hat
      am 29.08. offengelegt, dass ihr Lesepfad bis zum 27.08.2026 JEDE Anfrage
      OHNE das vom Einbettungsmodell verlangte Anfrage-Prefix eingebettet hat.
      Diese Messung lief am 24.08. — also drei Tage davor, mitten im Fehler.
      Bei der Gegenstelle selbst hob die Korrektur gepaart 42 auf 52 Treffer
      unter den ersten fuenf (McNemar p = 0,00635); fuer unseren Namensraum
      wurde sie nie nachgemessen.
      WAS DAMIT FAELLT, ist nicht die Zahl, sondern die ZUSCHREIBUNG. Der
      Eintrag sagt "Ursache ist der Inhalt der Erinnerungen, nicht das
      Verfahren". Genau das ist jetzt unbelegt: Ein Teil des schwachen Beitrags
      der vierten Quelle kann der Prefix-Fehler gewesen sein. Beides zugleich
      ist ebenfalls moeglich, und keines der beiden ist gemessen.
      WAS STEHEN BLEIBT: Die Aenderung, die dieser Eintrag ausgeloest hat —
      Alarm-Meldung und Wartungsbeschreibung in den gespiegelten Satz — war
      unabhaengig davon richtig; der Freitext traegt den Grund eines
      Degradationsverlaufs, und ohne ihn kann das Gedaechtnis ihn nicht kennen.
      Was fehlt, ist der BELEG dafuer, dass sie geholfen hat. Eine Neumessung
      ist ohnehin faellig: Der Neuspiegel-Lauf aendert jeden Satz, und Messungen
      davor und danach sind nicht vergleichbar.
    freigabe:
      - "intern"
    bemerkung: >-
      Der Schalter blieb nach der Messung ausgeschaltet. Die Messung belegt genau
      das, wogegen der Schalter gebaut wurde: Eine zusätzliche Quelle ohne Inhalt
      verdrängt in der Ergebnisverschmelzung zutreffende Treffer nach hinten,
      ohne eigene beizusteuern. Die Bedingung ist damit nicht widerlegt, sondern
      noch nicht prüfbar — sie wird erneut gemessen, sobald die Erinnerungen
      beschreibenden Text führen.

