      DIE WAHL VON 0,75 STUETZT SICH AUF ZWEI BEFUNDE. Erstens traegt der
      Schritt: gepaarter exakter Permutationstest, zweiseitig, n=9 —
      Trefferquote +0,213, Rangguete +0,142, verdichtete Rangguete +0,198, je
      p=0,016; kein einziger verlorener Treffer, 70 Prozent der Anfragen mit
