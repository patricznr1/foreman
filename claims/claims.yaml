  - id: "C-062"
    aussage: "Ein Treffer aus dem Gedächtnis lässt sich seiner Quellzeile zuordnen."
    status: "gemessen"
    wert: "Herkunftsangabe im Treffer, sobald die Erinnerung sie trägt; sonst kein Eintrag statt einer geratenen Zuordnung"
    bedingung: >-
      Gebaut am 25.08.2026 als Antwort auf C-060. Die Spiegel-Nutzlast führt Art
      und Kennung der Quellzeile und geht als Beiwerk an die Gegenstelle mit; der
