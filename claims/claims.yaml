  - id: "C-060"
    aussage: "Die Freigabe-Bedingung für das Gedächtnis als vierte Archiv-Quelle ist mit der heutigen Antwortform nicht messbar."
    status: "gemessen"
    wert: "0 von 77 ausgelieferten Erinnerungs-Treffern konnte einer Quellzeile zugeordnet werden"
    bedingung: >-
      Gemessen am 25.08.2026 gegen die laufende Instanz, nachdem der Nachtrag
      gelaufen war und die Erinnerungen erstmals beschreibenden Text trugen. Der
      Bewertungssatz aus C-047 beurteilt Quellzeilen; ein Treffer aus dem
      Gedächtnis führt jedoch die Kennung 0, weil eine Erinnerung keinen
      Primärschlüssel hat und die Antwort die Herkunftsangaben der
      Spiegel-Nutzlast nicht durchreicht. Ein solcher Treffer kann damit
      RECHNERISCH NIE als zutreffend gezählt werden — die zweite Schwelle
      (mindestens 30 Prozent der Anfragen mit einem zusätzlichen zutreffenden
      Treffer) ist nicht widerlegt, sondern nicht prüfbar. Dieselbe fehlende
      Herkunftsangabe blockiert die bereits vermerkte Doppelfund-Auflösung; es
      ist ein Mangel mit zwei Wirkungen, nicht zwei Mängel.
    datum: "2026-08-25"
    fundstelle:
