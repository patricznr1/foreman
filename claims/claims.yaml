    bedingung: >-
      Unsere Hälfte SELBST gemessen an den Zeitstempeln der Railway-Ausrollungen
      des Backends (2b4edc24 → 7a681882, derselbe Commit 658bb65 — ein Ausrollen
      ohne Codeänderung ist die Variablenänderung) und am Deploy-Protokoll
      („Substrat-Smoke beim Start: ok=True latency_ms=6942.23", 07:22:01 UTC).
      Die Hälfte der Gegenstelle ist FREMDERHEBUNG: zwei Sonden im
      Zwei-Sekunden-Takt auf ihren Healthcheck und eine Substrat-Route, dort als
      C-186 geführt; die 363 ms stammen aus ihrem retrieval_logs. Reihenfolge war
      NEXUS zuerst, dann FOREMAN — Patric hat sie als eigene Aussage bestätigt.
      WARUM DIE SUMME UND NICHT DAS MAXIMUM: Beide Seiten lesen den Token beim
      Prozessstart (bei uns `get_settings()` mit `lru_cache`, config.py:203, und
      der Klient friert den Kopf beim Bau ein, client.py:83). Die Variable zu
      setzen bewirkt allein nichts; das Ausrollen ist der Neustart, und der
      zweite kann erst beginnen, wenn der erste durch ist.
      WAS DIE MESSUNG NICHT DECKT: den zweiten FOREMAN-Prozess. Der Live-Worker
      (gleiches Abbild, eigener Variablensatz) hatte NIE einen Substrat-Token —
      SUBSTRATE_TOKEN ist in seinem Dienst nicht gesetzt (Patric, Railway,
      03.09.2026). Die Rotation hat für ihn nichts geändert. Der erste Eintrag
      dieses Registers sagte „trägt noch den alten Wert" — ein Schluss vom
      geteilten Abbild auf geteilte Variablen, der bei Railway nicht hält:
      Variablen hängen am Dienst, nicht am Abbild. Folgenlos war es nur, weil
      der Live-Erzeuger keine diskreten Ereignisse liefert (live.py:227) — jede
      Spiegelung aus dem Worker wäre sonst still in 401 gelaufen (client.py:115
      baut ohne Token einen Klienten ohne Authorization-Kopf; der Recall-Weg
      ist best-effort). Zahlen über „Ereignisse aus dem Worker im Gedächtnis"
      sind null — nicht aus Verfügbarkeit.
