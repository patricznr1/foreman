    wert: "18 Anfragen, 79 Relevanz-Zuordnungen, 86,6 % Übereinstimmung aller drei Beurteiler"
    bedingung: >-
      Erhoben am 24.08.2026 gegen den Bestand der laufenden Demo-Instanz
      (36 Freitext-Einträge: 14 Schichtnotizen, 16 Wartungsvorgänge, 6 Alarme).
      Die Anfragen wurden formuliert, bevor die Relevanz feststand; die Relevanz
      wurde getrennt davon von drei Beurteilern mit unterschiedlichem Blickwinkel
      (Instandhalter, Zuverlässigkeitsingenieur, strenger Prüfer) vergeben.
      Aufgenommen wurde eine Zuordnung ab zwei von drei Stimmen. Von 82 genannten
      Zuordnungen trugen 71 alle drei Beurteiler. Eine Kontroll-Anfrage ohne
      Entsprechung im Bestand liessen alle drei erwartungsgemäss leer.
    datum: "2026-08-24"
    fundstelle:
      - "GROUND_TRUTH.md, Abschnitt 15.10 (Freigabe-Bedingung 1)"
    geltung: "gueltig"
    freigabe:
      - "intern"
      - "fach"
    bemerkung: >-
      Der Aufwand mit drei Beurteilern hat einen Grund: Ein Bewertungssatz, dessen
      Relevanz von einem einzigen Urteil abhängt, misst dieses Urteil mit. Die
      Übereinstimmungsquote ist deshalb selbst eine Kennzahl — fiele sie niedrig
      aus, wäre nicht die Suche schlecht, sondern die Aufgabe schlecht gestellt.
      Bekannte Grenze des Satzes: Der Bestand umfasst 19 Tage und enthält keinen
      Vorgang, der sich wiederholt; die maschinenübergreifende Kette wird an
      einem einzigen Vorfall gemessen.

  - id: "C-048"
