  - id: "C-100"
    aussage: "Von den Faehigkeiten des Gedaechtnissystems nutzt FOREMAN Schreiben, Lesen und Loeschen; Wissensnetz, Selbstauskunft, Drifterkennung und Kontextaufbau werden nicht gerufen."
    status: "gemessen"
    wert: "remember 4 Aufrufe, recall 3, forget 2 — reason 0, reflect 0, drift_status 0; ein Pfad fuer den Kontextaufbau fehlt im Client ganz"
    bedingung: >-
      Abgelesen am 28.08.2026 am Quelltext: `substrate/client.py` fuehrt die
      Pfade in `_paths`; ein Pfad fuer den Kontextaufbau ist weder als Vorgabe
      noch als Einstellung vorhanden. `archive/search.py::_substrat_treffer`
      ruft ausschliesslich `recall(query, max_results=k)` und formt die flache
      Trefferliste zu einer vierten Rangliste fuer die Fusion.
      AUSGEZAEHLT wurden die Aufrufe im Quelltext, ohne die Client-Datei selbst:
      remember in ingestion/semantic.py, substrate/backfill.py und
      substrate/smoke.py; recall in reasoners/event_chain/recall.py,
      reasoners/failure/recall.py und substrate/smoke.py; forget in
      substrate/aufraeumen.py und substrate/nachtrag.py. Fuer reason, reflect
      und drift_status findet sich kein einziger Aufrufer.
      NICHT BELEGT und deshalb hier nicht behauptet: WARUM das so ist. Eine
      Entscheidung gegen den Kontextaufbau ist in GROUND_TRUTH, im Register und
      in den Freigabe-Bedingungen nirgends dokumentiert — daraus folgt aber
      nicht, dass sie nicht getroffen wurde. Der Quelltext sagt, was gerufen
      wird, nicht warum.
    datum: "2026-08-28"
    fundstelle:
      - "src/foreman/substrate/client.py, _paths"
      - "src/foreman/archive/search.py, _substrat_treffer"
      - "Commit fad4de5"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      WARUM DER EINTRAG WICHTIG IST, obwohl er nur eine Bauweise beschreibt:
      FOREMAN ist nach Aussage des Erbauers dafuer gebaut, die Staerken des
      Gedaechtnissystems im Industrieumfeld zu nutzen. Genau die Faehigkeiten,
      die es von einem Vektorspeicher unterscheiden — Wissensnetz,
      Selbstauskunft, Drifterkennung, Kontextaufbau —, sind angebunden und
      werden nicht gerufen. Der Abstand zwischen Zweck und Bauzustand ist damit
      beziffert statt behauptet.
      WAS TROTZDEM ANKOMMT: Verdichtung und Vergessen formen den Bestand, den
      der Abruf durchsucht. Sie wirken also, nur eine Ebene tiefer. Was NICHT
      ankommt, ist die Zusammenstellung — Schichtung, Gespraechspuffer,
      Zeitrahmen.
      WAS DAS BEGRENZT: `substrate_k = 5` deckelt den Beitrag unabhaengig von
      der Bestandsgroesse. Waechst der Bestand, waechst die Konkurrenz der
      anderen drei Quellen um dieselben 15 Plaetze, der Beitrag der vierten aber
      nicht. Der Wert steht in GROUND_TRUTH bis heute unter "nie kalibriert" —
      neben der Ausgabelaenge (inzwischen erhoben, C-087) und dem Vektor-Cutoff
      (inzwischen erhoben, C-091).
      OFFEN UND AUSDRUECKLICH NICHT ENTSCHIEDEN: ob ein Kontextaufbau in einer
      Suche, die vier Ranglisten fusioniert, ueberhaupt verwendbar waere. Er
      liefert eine Zusammenstellung, keine Kandidaten mit Raengen. Das ist eine
      Produkt- und Architekturfrage, keine Messfrage.
