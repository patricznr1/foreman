  - id: "C-102"
    aussage: >-
      Das Gedaechtnis schoepft sein Abrufbudget voll aus; mehr als die Haelfte
      der Erinnerungen entfaellt in der Zusammenfuehrung, weil sie einen
      Treffer der eigenen Quellen doppelt.
    status: "gemessen"
    wert: >-
