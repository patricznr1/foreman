      In der Zusammenfuehrung verbleiben 22; 28 entfallen. Bei 2 von 10
      Anfragen (B05, B08) traegt das Gedaechtnis nichts bei, bei 1 von 10
      (B06) alle fuenf.
    bedingung: >-
      Erhoben am 28.08.2026 gegen die oeffentliche Demo-Instanz, gleiche
      Anfragen und gleiches k wie C-101. Zwei Laeufe: einer mit
      `sources=memory` allein, einer mit allen vier Quellen; verglichen wurde
      je Anfrage die Zahl der Gedaechtnis-Treffer.
      WAS DER LAUF WIDERLEGT: die Vermutung, der Rollen-Ausschnitt verwerfe
      Erinnerungen ohne bekannten Maschinenbezug. Der Nur-Gedaechtnis-Lauf
      liefert bei jeder Anfrage volle fuenf — der Ausschnitt verwirft nichts,
