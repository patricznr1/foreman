      Bewertungssatz war er nicht zu bemerken.

  - id: "C-049"
    aussage: "Die Güte der quellenübergreifenden Archiv-Suche ist erstmals beziffert."
    status: "gemessen"
    wert: "Trefferquote 0,256 · Genauigkeit 0,415 · Ranggüte 0,372 (k=10, drei Quellen, Schwelle 0,60)"
    bedingung: >-
