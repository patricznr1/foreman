    geltung: "gueltig"
    freigabe:
      - "intern"
      - "fach"
    bemerkung: >-
      Der Befund ist allgemeiner als der eine Zahlenwert: Eine Schwelle, die
      Treffer verwirft, meldet nichts, wenn sie zu streng steht. Der Ausfall sieht
