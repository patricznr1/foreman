    aussage: "Eine Rotation des Substrat-Tokens öffnet ein Fenster von rund vier Minuten, in dem FOREMAN das Gedächtnis nicht erreicht — beide Hälften gemessen, nicht abgeleitet."
    status: "gemessen"
