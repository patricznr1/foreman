    status: "gemessen"
    wert: "Anteil zutreffender Treffer 0,403 auf 0,445, ohne dass ein zutreffender Treffer verloren geht"
    bedingung: >-
      Gebaut und gemessen am 26.08.2026. Eine Schichtnotiz ist über ihr Embedding
      als eigene Quelle auffindbar und über ihre Spiegelung als Erinnerung; die
      Verschmelzung sah zwei getrennte Ranglisten und rangierte denselben Vorgang
      deshalb doppelt hoch — er verdrängte andere Treffer, ohne mehr zu sagen.
      Zeigt eine Erinnerung über ihren Rückweg (C-062) auf eine Zeile, die bereits
      als eigener Treffer dasteht, fällt sie jetzt weg. Der eigene Treffer bleibt:
      Er trägt die echte Kennung, seine Zeitangabe stammt aus der Datenbank statt
      aus dem Abruf, und sein Auszug ist der ungekürzte Originaltext. Die
      Auflösung greift VOR dem Kürzen, damit ein echter Treffer nachrückt statt
      einer Lücke. Eine Erinnerung ohne Rückweg bleibt unangetastet. Gemessen an
      denselben 18 Anfragen wie in C-049.
    datum: "2026-08-26"
    fundstelle:
