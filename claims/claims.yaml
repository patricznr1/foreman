      eigenes Anzeige-Attribut. NICHT als Quellenart des Treffers: Die Herkunft
      bleibt sichtbar das Gedächtnis, denn als Wartungseintrag ausgegeben wäre
      die Erinnerung eine Behauptung über die eigene Datenlage, die nicht stimmt.
      Beide Angaben werden verlangt — eine Art ohne Kennung zeigt auf eine ganze
      Tabelle, eine Kennung ohne Art auf eine Zahl ohne Bezug. Der Nachtrag
      ergänzt sie im Altbestand, weil er die Quellzeile ohnehin gefunden hat;
      ohne diesen Schritt bliebe der Bestand auch nach der Anreicherung
      unzuordenbar. Zehn Prüffälle, sechs Gegenproben gefahren.
