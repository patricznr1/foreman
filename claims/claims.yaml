      einziger davon ist zutreffend. Sie sind der Grund, warum die Ranggüte auf
      sieben Anfragen fällt, obwohl kein Treffer verloren geht. Nach dem
      Aufräumen (C-065) ist erneut zu messen.

  - id: "C-067"
    aussage: "Die adversariale Prüfung des Löschwerkzeugs fand vor dem Push zwei Wege, auf denen nicht verwaiste Zeilen gelöscht worden wären."
    status: "gemessen"
    wert: "12 Prüfagenten, 8 Befunde verifiziert, 6 bestätigt, 2 widerlegt; 2 der bestätigten hätten lebende Quellzeilen unwiederbringlich entfernt"
    bedingung: >-
      Durchgeführt am 27.08.2026 gegen den fertigen, getesteten Stand, VOR dem
      Push. Beide schweren Befunde hatten dieselbe Wurzel: Die Prüfung des
      Löschwerkzeugs benutzte die Antwort einer Funktion, die eine ANDERE Frage
      beantwortet. `nachtrag._quellzeile` sagt, WELCHE Quellzeile eine Spiegelung
      beschreibt, und darf mit "lässt sich nicht sagen" antworten; das Aufräumen
      fragt, ob es ÜBERHAUPT noch eine gibt. Aus "ich ordne nichts zu" wurde
      damit "es gibt nichts" — einmal bei mehrdeutigen Merkmalen, einmal bei
      einer Kennung, die nach einem Neuaufbau der Quelltabellen nicht mehr
      auflöst. Der zweite Fall hätte den gesamten Bestand betroffen, für den das
      Werkzeug gebaut ist. Beide Zusicherungen standen so im Kopfkommentar, und
      der Code hielt sie nicht.
