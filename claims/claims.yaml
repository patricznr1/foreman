    bemerkung: >-
      Der Befund entstand erst, nachdem der Inhalt stimmte. Solange die
      Erinnerungen nur Struktur trugen, sah das Ergebnis wie eine gescheiterte
      Freigabe aus; jetzt zeigt sich, dass die Messung an dieser Stelle gar nicht
      greifen kann. Die Lehre ist die des ganzen Tages: Ein Aufbau, der ein
      Ergebnis rechnerisch ausschliesst, liefert trotzdem eine Zahl.

  - id: "C-061"
    aussage: "Werden die Erinnerungs-Treffer ihrer Quellzeile zugeordnet, verbessert die vierte Quelle die Archiv-Suche deutlich."
    status: "gemessen"
    wert: "Trefferquote 0,256 auf 0,558; Ranggüte 0,372 auf 0,619; 70,6 % der Anfragen mit zusätzlichem zutreffendem Treffer, keine mit verlorenem"
    bedingung: >-
      HILFSAUSWERTUNG vom 25.08.2026, ausdrücklich nicht die Freigabe-Messung:
      Sie ordnet jeden Erinnerungs-Treffer nachträglich über Maschine und
      Zeitpunkt seiner Quellzeile zu — dasselbe Verfahren wie im Nachtrag und aus
      demselben Grund nur bei Eindeutigkeit. Grundlage sind dieselben 18 Anfragen
      und derselbe Bewertungssatz wie in C-049. Von 77 ausgelieferten
      Erinnerungs-Treffern liessen sich 42 zuordnen; 30 nicht, weil ihre
      Quellzeile nicht mehr besteht (C-054). Besonders deutlich bei Anfragen, an
      denen die Volltextsuche an deutschen Wortzusammensetzungen scheitert: vier
      Anfragen ohne jeden zutreffenden Treffer bekommen aus dem Gedächtnis genau
      den gesuchten Vorgang.
    datum: "2026-08-25"
    fundstelle:
      - "tools/archiv_guete/ordne_gedaechtnis_zu.py"
      - "docs/messungen/2026-08-24_archiv_goldset.md"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      Die Zahlen belegen NICHT die Freigabe — sie belegen, was eine durchgereichte
      Herkunftsangabe sichtbar machen würde (C-060). Zwei Vorbehalte gehören
      dazu: Die Zuordnung geschieht nachträglich und ausserhalb des Produktpfades,
      und der zugrunde liegende Bestand enthält keinen wiederkehrenden Vorgang
      (C-047). Vor einer Freigabe ist die Messung mit durchgereichter Herkunft zu
      wiederholen; bis dahin bleibt der Schalter aus.

  - id: "C-062"
    aussage: "Ein Treffer aus dem Gedächtnis lässt sich seiner Quellzeile zuordnen."
    status: "gemessen"
    wert: "Herkunftsangabe im Treffer, sobald die Erinnerung sie trägt; sonst kein Eintrag statt einer geratenen Zuordnung"
    bedingung: >-
      Gebaut am 25.08.2026 als Antwort auf C-060. Die Spiegel-Nutzlast führt Art
      und Kennung der Quellzeile und geht als Beiwerk an die Gegenstelle mit; der
      Abruf reicht beide jetzt zurück, und der Archiv-Treffer trägt sie als
      eigenes Anzeige-Attribut. NICHT als Quellenart des Treffers: Die Herkunft
      bleibt sichtbar das Gedächtnis, denn als Wartungseintrag ausgegeben wäre
      die Erinnerung eine Behauptung über die eigene Datenlage, die nicht stimmt.
      Beide Angaben werden verlangt — eine Art ohne Kennung zeigt auf eine ganze
      Tabelle, eine Kennung ohne Art auf eine Zahl ohne Bezug. Der Nachtrag
      ergänzt sie im Altbestand, weil er die Quellzeile ohnehin gefunden hat;
      ohne diesen Schritt bliebe der Bestand auch nach der Anreicherung
      unzuordenbar. Zehn Prüffälle, sechs Gegenproben gefahren.
    datum: "2026-08-25"
    fundstelle:
      - "src/foreman/reasoners/event_chain/recall.py, RecallItem"
      - "src/foreman/archive/search.py (Erinnerungs-Zweig)"
      - "src/foreman/substrate/nachtrag.py"
      - "GROUND_TRUTH.md, Abschnitt 15.10"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      Hebt C-060 NICHT auf: Die Zuordnung ist jetzt möglich, die Freigabe-Messung
      damit aber noch nicht wiederholt. Erst ein erneuter Lauf gegen einen
      Bestand, dessen Erinnerungen die Herkunft tragen, belegt, ob die vierte
      Quelle die Schwellen erfüllt. Der Altbestand bekommt sie beim nächsten
      Nachtrag; bis dahin bleibt der Schalter aus.

  - id: "C-063"
    aussage: "Derselbe Vorgang steht in einer Trefferliste nur einmal, auch wenn ihn zwei Quellen führen."
    status: "gemessen"
    wert: "Anteil zutreffender Treffer 0,403 auf 0,445, ohne dass ein zutreffender Treffer verloren geht"
    bedingung: >-
      Gebaut und gemessen am 26.08.2026. Eine Schichtnotiz ist über ihr Embedding
      als eigene Quelle auffindbar und über ihre Spiegelung als Erinnerung; die
      Verschmelzung sah zwei getrennte Ranglisten und rangierte denselben Vorgang
      deshalb doppelt hoch — er verdrängte andere Treffer, ohne mehr zu sagen.
      Zeigt eine Erinnerung über ihren Rückweg (C-062) auf eine Zeile, die bereits
      als eigener Treffer dasteht, fällt sie jetzt weg. Der eigene Treffer bleibt:
      Er trägt die echte Kennung, seine Zeitangabe stammt aus der Datenbank statt
      aus dem Abruf, und sein Auszug ist der ungekürzte Originaltext. Die
      Auflösung greift VOR dem Kürzen, damit ein echter Treffer nachrückt statt
      einer Lücke. Eine Erinnerung ohne Rückweg bleibt unangetastet. Gemessen an
      denselben 18 Anfragen wie in C-049.
    datum: "2026-08-26"
    fundstelle:
      - "src/foreman/archive/search.py, _ohne_doppelfunde"
      - "tests/archive/test_archive_search.py"
      - "GROUND_TRUTH.md, Abschnitt 15.10"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      Der Prüfaufbau hat sich dabei selbst korrigiert: Zwei Gegenproben — die
      Auflösung aus der Verschmelzung herausnehmen und sie hinter das Kürzen
      ziehen — blieben zunächst grün, weil jeder Test die Hilfsfunktion direkt
      aufrief statt den Weg, den eine Anfrage tatsächlich nimmt. Eine getestete
      Funktion, die niemand aufruft, ist so wirkungslos wie eine fehlende. Erst
      ein Test gegen die vollständige Suche fing beide.

  - id: "C-064"
    aussage: "Die Freigabe-Schwelle der Archiv-Suche verlangt, dass kein zutreffender Treffer verloren geht — nicht, dass keiner die Position wechselt."
    status: "gemessen"
    wert: "Präzisiert am 26.08.2026; Anlass ist eine Anfrage mit Trefferquote 0,50 auf 0,67 ohne Verlust, die nach der alten Fassung als verschlechtert galt"
    bedingung: >-
      Die ursprüngliche Fassung lautete "auf keiner Anfrage schlechter als die
      Baseline" und wurde in der Messung als gefallene Ranggüte ausgelegt. Damit
      galt eine Anfrage schon dann als verschlechtert, wenn ein zutreffender
      Treffer eine Position nach hinten rutschte — auch wenn keiner verloren ging
      und MEHR gefunden wurde. Gemessen am 26.08.2026 trifft das die Anfrage
      G-11: Trefferquote 0,50 auf 0,67, kein verlorener Treffer, und trotzdem
      "schlechter". Eine Bedingung, die eine Verbesserung als Verschlechterung
      ausweist, misst nicht, was sie messen soll. Ein verlorener Treffer bleibt
      ohne Toleranz ein Ausschlussgrund; die Ranggüte wird weiterhin erhoben und
      ausgewiesen, aber als Kennzahl statt als Schwelle.

      DIE ÄNDERUNG IST FÜR DAS ERGEBNIS ENTSCHEIDEND, und das gehört
      offengelegt: Auf demselben Messlauf zählt die alte Lesart SIEBEN von 18
      Anfragen als verschlechtert (G-01, G-03, G-04, G-08, G-10, G-11, G-15),
      die neue KEINE. Die Freigabe-Bedingung 1 gilt nach der alten Fassung als
      nicht erfüllt und nach der neuen als erfüllt. Wer die Präzisierung nicht
      teilt, liest den Messlauf also anders — beide Zahlen stehen deshalb hier
      nebeneinander statt nur die günstigere.
    datum: "2026-08-27"
    fundstelle:
      - "GROUND_TRUTH.md, Abschnitt 15.10"
      - "tools/archiv_guete/werte_aus.py"
      - "tools/archiv_guete/messung_2026-08-27_basis.json"
      - "tools/archiv_guete/messung_2026-08-27_gedaechtnis.json"
      - "docs/messungen/2026-08-27_archiv_goldset_nachmessung.md"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      Die Formulierung wurde geändert, NACHDEM gemessen war. Das ist die Stelle,
      an der eine Schwelle sich selbst bestätigen kann, und deshalb steht der
      Anlass hier mit der Zahl, die ihn ausgelöst hat: Wer die Änderung für eine
      Aufweichung hält, kann sie an G-11 nachprüfen. Wer die Reihenfolge zur
      Bedingung machen will, braucht dafür ein eigenes, begründetes Mass — die
      Position eines einzelnen Treffers ist keins.

  - id: "C-065"
    aussage: "Für Spiegelungen ohne Quellzeile besteht ein Weg, sie samt Erinnerung zu entfernen."
    status: "gemessen"
    wert: "Werkzeug gebaut und geprüft am 26.08.2026; betrifft 22 von 44 Spiegelungen (C-054), ohne sie steigt der Anteil zutreffender Treffer von 0,417 auf 0,562"
    bedingung: >-
      Erhoben und gebaut am 26.08.2026. Wird der Datenbestand neu aufgebaut,
      bleiben die Spiegelungen der alten Zeilen stehen: Sie beschreiben Vorgänge,
      die niemand mehr nachschlagen kann, belegen aber Plätze in jeder
      Trefferliste. Gemessen an denselben 18 Anfragen wie in C-049 steigt ohne
      sie der Anteil zutreffender Treffer von 0,417 auf 0,562 und die Ranggüte
      von 0,552 auf 0,613, ohne dass ein zutreffender Treffer verloren geht.
      Entfernt wird nur, was auf KEINEM der beiden Suchwege auffindbar ist UND wo
      die Zuordnung eindeutig ist — eine Zeile wegen einer zu engen oder einer
      nicht entscheidbaren Suche zu löschen wäre der schlimmere Fehler, sie käme
      nie wieder. Die Prüfung ist deshalb dreiwertig (GEFUNDEN / MEHRDEUTIG /
      VERWAIST): Passen mehrere Quellzeilen auf dieselben Merkmale, existiert die
      Quelle nicht nur, sie existiert doppelt; die Zeile bleibt stehen und wird
      getrennt gezählt. Und der gespeicherte Rückweg ist keine Sackgasse: Löst die
      Kennung nicht mehr auf, wird die Merkmalssuche trotzdem versucht — sonst
      löschte gerade der Bestand, für den das Werkzeug gebaut ist, weil neu
      aufgebaute Quelltabellen neue Kennungen vergeben. Ableitungen des Systems
      (Empfehlung, Ereigniskette) werden nicht angefasst; sie haben keine
      Quellzeile im Archiv-Sinn.
    datum: "2026-08-26"
    fundstelle:
      - "src/foreman/substrate/aufraeumen.py"
      - "tests/unit/test_substrate_aufraeumen.py"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      Gelöscht statt gefiltert: Ein Filter im Suchpfad versteckte den Rest, statt
      ihn zu beseitigen — er bliebe im Gedächtnis, ginge in jede Verdichtung ein
      und wäre bei jeder späteren Auswertung erneut zu berücksichtigen. Der
      Vorgang ist unumkehrbar, deshalb liegt der Schwerpunkt der Prüfung auf dem,
      was NICHT entfernt werden darf. Der Eintrag belegt den WEG, nicht seine
      Ausführung: C-054 (der Befund) bleibt gültig, bis der scharfe Lauf gegen die
      laufende Instanz erfolgt ist — dann wird er auf "ueberholt" gesetzt und die
      dann tatsächlich entfernte Zahl hier nachgetragen.

  - id: "C-066"
    aussage: "Das Gedächtnis als vierte Quelle der Archiv-Suche erfüllt beide Schwellen der Freigabe-Bedingung 1."
    status: "gemessen"
    wert: "0 von 18 Anfragen mit verlorenem Treffer, 11 von 18 = 61,1 % mit zusätzlichem zutreffendem Treffer; mittlere Trefferquote 0,256 auf 0,528, mittlere Ranggüte 0,372 auf 0,548, Anfragen ganz ohne zutreffenden Treffer 5 auf 1"
    bedingung: >-
      Gemessen am 27.08.2026 gegen die laufende Demo-Instanz, gegen denselben
      Bewertungssatz wie C-049 (18 Anfragen, Relevanz von drei unabhängigen
      Beurteilern). Zwei Voraussetzungen mussten dafür stehen: der Rückweg von
      einer Erinnerung auf ihre Quellzeile im Produktpfad (C-062, ohne ihn ist
      jeder Erinnerungs-Treffer auf keinen Schlüssel abbildbar — C-060) und die
      Zusammenführung der Doppelfunde (C-063). Die Schwelle gilt in der am
      selben Tag präzisierten Fassung; nach der vorherigen Lesart wäre sie NICHT
      erfüllt — siehe C-064, wo beide Zahlen nebeneinanderstehen.
    datum: "2026-08-27"
    fundstelle:
      - "tools/archiv_guete/messung_2026-08-27_basis.json"
      - "tools/archiv_guete/messung_2026-08-27_gedaechtnis.json"
      - "tools/archiv_guete/werte_aus.py"
      - "docs/messungen/2026-08-27_archiv_goldset_nachmessung.md"
    geltung: "gueltig"
    freigabe:
      - "intern"
    bemerkung: >-
      ERFÜLLT HEISST NICHT FREIGEGEBEN. Bedingung 1 ist eine von mehreren in
      GROUND_TRUTH §15.10; der Schalter bleibt aus, bis alle stehen. Und die
      Messung zeigt einen offenen Mangel, den die Schwelle nicht abfängt: 40 von
      137 ausgelieferten Plätzen (29,2 %) belegen Erinnerungen OHNE Rückweg —
