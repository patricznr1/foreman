  - id: "C-046"
    aussage: "Den Validierungs-Vorbehalt formuliert das System, nicht das Sprachmodell."
    status: "gemessen"
    wert: "2 von 2 heiklen Angaben einer Empfehlung kommen deterministisch: Zahlen und Vorbehalt"
    bedingung: >-
      Gegengeprüft auf dem Stand vom 24.08.2026. Die Vorgabe an das Modell
      untersagt beides ausdrücklich; der Vorbehalt wird aus einer festen
      Funktion angehängt, die Zahlen stammen aus der Vorhersage. Zwei Wächter
      sichern es zusätzlich ab: einer verwirft eine Empfehlung mit unbelegter
      Zahl, einer eine, die den Vorbehalt umdeutet. Beide verwerfen vollständig
      und speichern nicht — sie kennzeichnen nicht bloss.
    datum: "2026-08-24"
    fundstelle:
      - "src/foreman/reasoners/failure/prompts.py, RECOMMENDATION_SYSTEM_PROMPT"
      - "src/foreman/reasoners/failure/recommendation.py, detect_overclaim"
      - "tests/reasoners/failure/test_prompts.py"
    geltung: "gueltig"
    freigabe:
      - "intern"
      - "fach"
      - "kunde"
    bemerkung: >-
      Der Grund ist nicht Misstrauen gegen das Modell, sondern Arbeitsteilung:
      Eine Angabe, die strukturell garantiert sein soll, darf nicht davon
      abhängen, wie ein Sprachmodell sie an diesem Tag formuliert. Der Wächter
      gegen Umdeutung ist bewusst eng — er erkennt eine Verneinung nur
      unmittelbar vor der Phrase. Weiter gefasst liesse er echte Umdeutungen
      durch; ein Test hält diese Abwägung fest.

